name: Validate facilitators

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate (PR — probe changed files only)
        if: github.event_name == 'pull_request'
        run: pnpm validate --skip-authed --changed
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - name: Validate (push — full probe)
        if: github.event_name != 'pull_request'
        run: pnpm validate --skip-authed
